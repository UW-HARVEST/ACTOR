name: type safety

# Run the tests that the repo already has.
#
# WHY THIS DID NOT EXIST, AND WHY THAT MATTERED: `validate.yaml` is the only other
# workflow, and its sole cargo command is `cargo build --release`. It then scores
# stored results via `harvest-tools test all --check`. There is no `cargo test`
# anywhere in CI. So the 4 trybuild compile-fail cases added in #73 — whose entire
# job is to assert that `Sealed<P>` can never yield a filesystem path, that a
# `Completed` proof cannot be forged, and that phases are not interchangeable — have
# never executed in CI, nor have the unit tests added in #67, #70, #73 and #74.
#
# Those invariants are enforced by ABSENCE: no `AsRef<Path>`, no `path()`, no public
# constructor. Absence is exactly what a refactor deletes silently. Until this file
# existed, the only thing standing between a refactor and a silently broken invariant
# was whether someone remembered to run `cargo test` locally.
#
# DELIBERATELY NOT `--all-targets`: `tools/tests/integration.rs` needs the
# `test-corpus` and `results` submodules, so it cannot pass here. This job takes no
# submodules and needs no PAT, which is what keeps it fast and fork-safe.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: type-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # `.git` must be present: build.rs stamps the commit via `git rev-parse`,
          # and `provenance::tests::the_binary_under_test_carries_a_real_stamp`
          # asserts the stamp is not "unknown". A shallow clone is fine — only HEAD
          # is read — but a source export with no `.git` would fail that test, which
          # is the correct outcome rather than a false pass.
          submodules: false

      - name: Install the pinned toolchain
        # Let rust-toolchain.toml drive BOTH the version and the components. An
        # explicit `rustup toolchain install … --profile minimal` here was the
        # original bug: it produced 1.94.0 *without* rust-src, and rustc then renders
        # three fewer lines for a "required by a bound in `Command::current_dir`"
        # note, so every compile-fail expectation failed on formatting alone.
        #
        # RUSTUP_TOOLCHAIN in the environment silently overrides the file — that is
        # how the same expectations came to be recorded on 1.97.1 in the first place.
        # `cache::ToolchainId::detect` already refuses to run a measurement when it is
        # set; assert the same thing here so CI cannot drift from the pin either.
        run: |
          echo "RUSTUP_TOOLCHAIN=" >> "$GITHUB_ENV"
          rustup show active-toolchain
          rustc --version
          want=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          got=$(rustc --version | cut -d' ' -f2)
          if [ "$got" != "$want" ]; then
            echo "::error::pinned $want but rustc is $got — expectations are toolchain-sensitive"
            exit 1
          fi
          # rust-src must actually be present, or the compile-fail diffs are junk.
          rustup component list --installed | grep -qx 'rust-src' \
            || { echo "::error::rust-src missing; compile-fail expectations need std source"; exit 1; }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
          # Cache dependencies ONLY, never this crate's own artifacts.
          #
          # `validate.yaml` caches the whole workspace with `path: .`, which includes
          # `tools/target`. Restoring that here would let cargo report harvest-tools
          # as fresh, run zero tests' worth of new compilation, and pass having
          # analysed nothing — the same shape of silent no-op as a `--in-diff` filter
          # that matches no paths and exits 0.
          cache-targets: false

      - name: Unit tests (lib + bin)
        # `--bin harvest-tools` is load-bearing: `report.rs` (990 lines) and
        # `benchmark.rs` are declared only in main.rs, so a bare `--lib` would never
        # compile or run anything in them.
        run: cargo test --manifest-path tools/Cargo.toml --lib --bin harvest-tools

      - name: Compile-fail tests (the type invariants)
        # These assert that unsafe designs DO NOT COMPILE. A green run here means an
        # expression like `Command::new("x").current_dir(&sealed)` is still rejected
        # by the compiler.
        run: cargo test --manifest-path tools/Cargo.toml --test compile_fail

      - name: Lint (named lints, deliberately NOT -D warnings)
        # Most of the policy lives in tools/Cargo.toml's [lints] table, which cargo
        # applies to every target of the package -- so a newly added target cannot
        # escape it by omission, which a `#![deny]` in a crate root would allow (this
        # package has two roots sharing 13 modules).
        #
        # `clippy::panic` cannot live there: it is clean in production but fires 6 times
        # in test modules where `panic!` is the right way to assert an unreachable
        # branch -- cache.rs uses it to assert the agent is never invoked on a hit. So it
        # is denied here, scoped to `--lib --bins`, where cfg(test) is false and those
        # panics are structurally invisible.
        #
        # `-D warnings` is deliberately absent. main carries ~20 lib warnings and the
        # cleanup was declined; a permanently-red check teaches everyone to ignore CI.
        # Naming lints individually buys a strict gate today at zero cleanup cost.
        run: |
          cargo clippy --manifest-path tools/Cargo.toml --lib --bins -- -D clippy::panic
          # And prove the [lints] table is satisfied on every target, tests included.
          cargo clippy --manifest-path tools/Cargo.toml --all-targets

      - name: Show the recorded stderr of each invariant
        # On failure, trybuild prints a diff; on success the expectations are what
        # future readers need to see. Cheap, and it makes the invariants legible in
        # the log rather than only in the repo.
        if: always()
        run: |
          for f in tools/tests/compile-fail/*.stderr; do
            echo "── $(basename "$f")"
            head -4 "$f"
          done
