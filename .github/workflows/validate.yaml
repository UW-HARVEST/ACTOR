name: validate-translations
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # One job PER TOOL, in parallel: each replays BOTH datasets for its own tool. The 7-arm
  # `test all --check` matrix that was here had not passed once in 100 runs back past 2026-07-05, so
  # every PR merged on `type safety` alone -- it scored phase dirs no key attests, which is the
  # capability that is now gone. These jobs CAN pass: no agent, no credentials, and `--replay-only`
  # makes a miss a refusal.
  #
  # Split by tool and not by dataset because a tool is what the store either covers or does not:
  # `reproduce.sh` replayed claude alone for months while four agents published `0/128` for P01. Each
  # job checks every row it regenerates against the committed table verbatim, and the three cover
  # every row between them; `TOOLS=claude,codex,kiro tools/reproduce.sh all` is the byte-for-byte form
  # and stays the release check, because only a run covering every tool can diff the merged tables.
  reproduce:
    name: Reproduce ${{ matrix.tool }}'s published numbers from the cache
    runs-on: ubuntu-24.04
    strategy:
      # Never fail-fast: "codex misses the store" and "kiro misses the store" are different findings,
      # and cancelling the others hides the second one behind the first.
      fail-fast: false
      matrix:
        tool: [claude, codex, kiro]
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      # NO --depth=1: a shallow fetch produces only the tip, so a submodule pinned elsewhere cannot
      # be checked out and the runner holds a different results tree than the pin names.
      - name: Check out submodules at their pinned commits
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init results test-corpus harvest-bench

      - name: Assert every input this run needs is present
        run: |
          fail=0
          for m in results test-corpus harvest-bench; do
            want=$(git ls-tree HEAD "$m" | awk '{print $3}')
            have=$(git -C "$m" rev-parse HEAD)
            echo "$m: pinned $want / checked out $have"
            [ "$want" = "$have" ] || { echo "::error::$m is not at its pin"; fail=1; }
          done
          test -d results/.cache || { echo "::error::results/.cache is absent — the pin predates the commit that ships the cache"; fail=1; }
          # Not cosmetic: omitting harvest-bench here let the Test-Corpus leg run 19 minutes to completion
          # before the HB leg died on a missing tests/ dir. Refuse at second 0 instead.
          test -d harvest-bench/tests || { echo "::error::harvest-bench/tests is absent, so the HB leg cannot run"; fail=1; }
          # The gtest suites need CMake >= 3.24. `HarvestBench::preflight` refuses too; this only moves
          # the refusal ahead of a Test-Corpus leg that would otherwise run first and pass.
          cm=$(cmake --version | head -1 | grep -oE '[0-9]+(\.[0-9]+)+')
          printf '%s\n%s\n' 3.24 "$cm" | sort -VC || { echo "::error::cmake $cm is older than 3.24, so no gtest suite would configure"; fail=1; }
          echo "cmake $cm"
          exit $fail

      - name: Set up Rust
        run: |
          rustup toolchain install 1.94.0 --profile default
          rustup default 1.94.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build harvest-tools
        run: cargo build --release --locked --manifest-path tools/Cargo.toml

      # Scoring the HB leg shells out to this; it is a separate crate inside the submodule, so building
      # harvest-tools does not produce it.
      - name: Build the harvest-bench runner
        run: cargo build --release --locked --manifest-path harvest-bench/runner/Cargo.toml

      # Both legs, one tool. The scope is what the store can serve, so there is no battery list here to
      # drift from what is cacheable.
      - name: Reproduce
        env:
          TOOLS: ${{ matrix.tool }}
        run: |
          export CARGO_BUILD_JOBS=$(nproc)
          ./tools/reproduce.sh all
