name: validate-translations
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The only job, and it CAN pass: no agent, no credentials, and `--replay-only` makes a miss a
  # refusal. The 7-arm `test all --check` matrix that was here had not passed once in 100 runs back
  # past 2026-07-05, so every PR merged on `type safety` alone. It scored phase dirs no key attests,
  # which is the capability this PR deletes, so there is nothing left for it to run.
  reproduce:
    name: Reproduce the published numbers from the cache
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      # NO --depth=1: a shallow fetch produces only the tip, so a submodule pinned elsewhere cannot
      # be checked out and the runner holds a different results tree than the pin names.
      - name: Check out submodules at their pinned commits
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init results test-corpus harvest-bench

      - name: Assert the submodules are at their pins
        run: |
          fail=0
          for m in results test-corpus harvest-bench; do
            want=$(git ls-tree HEAD "$m" | awk '{print $3}')
            have=$(git -C "$m" rev-parse HEAD)
            echo "$m: pinned $want / checked out $have"
            [ "$want" = "$have" ] || { echo "::error::$m is not at its pin"; fail=1; }
          done
          test -d results/.cache || { echo "::error::results/.cache is absent — the pin predates the commit that ships the cache"; fail=1; }
          # Not cosmetic: omitting harvest-bench here let the Test-Corpus leg run 19 minutes to completion
          # before the HB leg died on a missing tests/ dir. Refuse at second 0 instead.
          test -d harvest-bench/tests || { echo "::error::harvest-bench/tests is absent, so the HB leg cannot run"; fail=1; }
          exit $fail

      - name: Set up Rust
        run: |
          rustup toolchain install 1.94.0 --profile default
          rustup default 1.94.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build harvest-tools
        run: cargo build --release --locked --manifest-path tools/Cargo.toml

      # One job, no matrix: `run` produces every output from what it resolved, and the scope is what
      # the store can serve -- so there is no list of batteries here to drift from what is cacheable.
      - name: Reproduce
        env:
          CARGO_BUILD_JOBS: "2"
        run: ./tools/reproduce.sh all
