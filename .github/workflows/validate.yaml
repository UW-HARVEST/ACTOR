name: validate-translations
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Check out submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth=1 results test-corpus

      - name: Set up Rust
        run: |
          rustup toolchain install 1.94.0 --profile default
          rustup toolchain install nightly --profile default
          rustup default 1.94.0
          cargo --version
          rustc --version

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fix cando2 paths for CI
        run: |
          CANDO2_PATH="$GITHUB_WORKSPACE/test-corpus/tools/cando2"
          find results/ -path "*/runner/Cargo.toml" -exec sed -i "s|path = \".*cando2\"|path = \"$CANDO2_PATH\"|" {} +

      - name: Validate c2rust translations
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          if [ -d results/c2rust ]; then
            python3 scripts/validate.py --results-dir results/c2rust
          else
            echo "No c2rust results found, skipping"
          fi

      - name: Validate kiro translations
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          if [ -d results/kiro ]; then
            python3 scripts/validate.py --results-dir results/kiro
          else
            echo "No kiro results found, skipping"
          fi

      - name: Validate claude translations
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          if [ -d results/claude ]; then
            python3 scripts/validate.py --results-dir results/claude
          else
            echo "No claude results found, skipping"
          fi
