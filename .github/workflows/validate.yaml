name: validate-translations
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Check out submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_PAT }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth=1 results test-corpus

      - name: Set up Rust
        run: |
          rustup toolchain install 1.94.0 --profile default
          rustup toolchain install nightly --profile default
          rustup default 1.94.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build harvest-tools
        run: cargo build --release --manifest-path tools/Cargo.toml

      - name: Validate c2rust translations
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          if [ -d results/c2rust ]; then
            ./tools/target/release/harvest-tools --agent c2rust test all --check
          fi

      - name: Validate kiro translations
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          if [ -d results/kiro ]; then
            ./tools/target/release/harvest-tools --agent kiro test all --check
          fi

      - name: Validate claude translations
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          if [ -d results/claude ]; then
            ./tools/target/release/harvest-tools --agent claude test all --check
          fi
