[package]
name = "harvest-tools"
version = "0.1.0"
edition = "2021"
# The repo ships an MIT LICENSE, but the package declared none. Any dependency-policy
# tool treats a package with no `license` key as unlicensed and errors on it -- so
# this one line is what makes our own crate pass the check we would apply to others.
license = "MIT"

[lib]
name = "harvest_tools"
path = "src/lib.rs"

[[bin]]
name = "harvest-tools"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
trybuild = "1"

[build-dependencies]
vergen-gitcl = { version = "9.1.0", features = ["build", "cargo", "rustc"] }

# Lints denied at the PACKAGE level, so every target inherits them and a newly added
# target cannot escape by omission -- which a `#![deny]` in a crate root would allow.
#
# `warnings = "deny"` is the real gate, and it is only reachable because the tree is at
# ZERO warnings across `--all-targets`. It was previously thought unreachable: the count
# looked like ~357 and the cleanup like a large project. Both were wrong. ~338 of those
# were the SAME 19 issues counted repeatedly, because `main.rs` re-declared 14 of the
# lib's modules and every line compiled 2-4 times; 16 of the 19 were auto-fixable by
# `cargo clippy --fix`; and the four "dead code" items were phantoms of that same
# duplication -- `all_case_names` and `defined_features` have real callers in
# tests/integration.rs. Making the bin consume the lib (see lib.rs) plus one
# `--fix` pass plus deleting two genuinely-unused functions took it to zero.
#
# So there is no allowlist here and no ratchet. Any new warning is an error.
[lints.rust]
warnings = "deny"
# Allow-by-default, so `warnings` does not reach it and it must be named.
unused_extern_crates = "deny"

[lints.clippy]
# All allow-by-default (clippy's `restriction`/`pedantic` groups), so `-D warnings`
# does NOT enable them; each must be named explicitly.
#
# Placeholder and debug residue -- the leftovers of an interrupted edit.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# LINT LAUNDERING -- the entry that makes everything above hold. Without it, every
# lint here is defeated by one `#[allow]` line and the gate is only as strong as the
# discipline it exists to replace. With it, a suppression must carry a written reason,
# so each widening is a sentence in the diff that a reviewer sees.
#
# `clippy::allow_attributes` (forcing `#[expect]` over `#[allow]`) is not denied:
# `#[expect]` is unusable for a lint that fires in one target and not another, and an
# unfulfilled expectation is itself a warning -- which `warnings = "deny"` now makes an
# error. Measured, not assumed: the conversion was attempted and reverted on that
# evidence. Known hole: neither lint fires on an attribute on a trait method
# declaration.
allow_attributes_without_reason = "deny"
