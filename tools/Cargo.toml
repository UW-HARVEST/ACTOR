[package]
name = "harvest-tools"
version = "0.1.0"
edition = "2021"

[lib]
name = "harvest_tools"
path = "src/lib.rs"

[[bin]]
name = "harvest-tools"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

