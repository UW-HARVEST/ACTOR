# ---------------------------------------------------------------------------
# tab:root-causes — manual triage of ACTOR's TRACTOR failures into categories.
# No categorizer exists; a human read each failing case's diff and assigned
# (possibly multiple) categories. Counts sum to 30 across the failing cases.
# ---------------------------------------------------------------------------
