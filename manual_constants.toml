# Human analysis or external cited data that no committed pipeline reproduces.
# `harvest-tools report` only transcribes this file into tables/manual.tex; it never
# computes these values. If one becomes derivable, move it to the generated numbers.tex.

# tab:root-causes — no categorizer exists; a human read each failing case's diff and
# assigned possibly multiple categories, so these sum to 30, not to the case count.
[root_causes]
undefined_behavior = 3
macros = 3
configuration = 1
input_processing = 9
underspecified_behavior = 2
truncated_output = 12

# tab:unsafe-root-causes — count_unsafe() yields blocks/fns/impls/lines, never
# categories; one-off grep-and-classify pass over a de-duplicated file set.
[unsafe_categories]
c_abi_preservation = 1648
external_ffi_calls = 208
function_pointer_dispatch = 36
mutable_global_state = 116
bridging_raw_pointers = 60
c_string_pointer_conversions = 2194
ptr_intrinsics = 527
uninitialized_zero_init = 70
raw_pointer_types = 5957
pointer_arithmetic = 3931
others = 44
total = 14791

# Caption aggregates for tab:unsafe-root-causes; the generator counts no comment/blank lines.
[unsafe_caption]
files = 382
loc = 56258
comment_lines = 1070
blank_lines = 7020

# tab:prompt-sensitivity — TRACTOR-derived (summary.json), but from a bespoke one-off
